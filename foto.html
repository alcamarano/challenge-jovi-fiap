<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#000000"/>
    <title>JOVI Lens | Foto</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS (CDN) + configuração da marca -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <!-- Estilos próprios -->
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body data-pagina="foto" class="bg-black">
    <div class="app app-camera">
      <!-- ===================== CABEÇALHO ===================== -->
      <header class="flex items-center gap-2 px-2 pt-2 pb-2">
        <a id="botao-voltar" href="galeria.html" class="botao-icone" aria-label="Voltar">
          <span data-icon="voltar" class="w-6 h-6"></span>
        </a>
        <div class="flex-1 min-w-0">
          <h1 id="titulo-foto" class="font-display font-semibold truncate">Foto</h1>
          <p id="subtitulo-foto" class="text-xs text-white/60 truncate"></p>
        </div>
        <button id="botao-info" class="botao-icone" aria-label="Detalhes da foto">
          <span data-icon="info" class="w-6 h-6"></span>
        </button>
      </header>
      <!-- ===================== IMAGEM ===================== -->
      <section id="palco" class="relative flex-1 min-h-0 mx-2 rounded-[20px] overflow-hidden bg-[#111] touch-pan-y" aria-live="polite">
        <!-- A miniatura aparece na hora e a imagem grande entra por cima quando carrega -->
        <img id="imagem" src="" alt="" class="absolute inset-0 w-full h-full object-contain transition-[filter] duration-300" />
        <img id="imagem-previa" src="" alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-contain blur-sm scale-105 transition-opacity duration-300" />
        <!-- Vídeo gravado -->
        <video id="video" class="hidden absolute inset-0 w-full h-full object-contain bg-black" controls playsinline></video>
        <!-- Setas (no computador); no celular, deslize -->
        <button id="anterior" class="absolute left-2 top-1/2 -translate-y-1/2 botao-icone bg-black/40" aria-label="Foto anterior">
          <span data-icon="esquerda" class="w-6 h-6"></span>
        </button>
        <button id="proxima" class="absolute right-2 top-1/2 -translate-y-1/2 botao-icone bg-black/40" aria-label="Próxima foto">
          <span data-icon="direita" class="w-6 h-6"></span>
        </button>
      </section>
      <!-- ===================== AÇÕES ===================== -->
      <nav id="acoes" class="grid grid-cols-5 px-2 pt-3 pb-[max(14px,env(safe-area-inset-bottom))]" aria-label="Ações da foto">
        <button id="acao-favoritar" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-white/10 text-xs font-semibold" aria-pressed="false">
          <span data-icon="coracao" class="w-6 h-6"></span> <span>Favoritar</span>
        </button>
        <button id="acao-editar" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-white/10 text-xs font-semibold">
          <span data-icon="ajustes" class="w-6 h-6"></span> Editar
        </button>
        <!-- Compartilhar em destaque: é a ação principal depois da foto -->
        <button id="acao-compartilhar" class="flex flex-col items-center gap-1 py-2 rounded-xl text-xs font-semibold text-jovi-900">
          <span class="w-12 h-12 -mt-2 rounded-full bg-sinal grid place-items-center">
            <span data-icon="compartilhar" class="w-6 h-6"></span>
          </span>
          <span class="text-white">Enviar</span>
        </button>
        <button id="acao-album" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-white/10 text-xs font-semibold">
          <span data-icon="album" class="w-6 h-6"></span> Álbum
        </button>
        <button id="acao-excluir" class="flex flex-col items-center gap-1 py-2 rounded-xl hover:bg-white/10 text-xs font-semibold text-red-300">
          <span data-icon="lixeira" class="w-6 h-6"></span> Apagar
        </button>
      </nav>
      <!-- ===================== EDIÇÃO LEVE ===================== -->
      <section id="editor" class="hidden px-4 pt-3 pb-[max(14px,env(safe-area-inset-bottom))]" aria-label="Edição da foto">
        <button id="auto-ajuste" class="w-full flex items-center justify-center gap-2 rounded-full bg-white/10 hover:bg-white/15 py-2.5 text-sm font-bold mb-3">
          <span data-icon="ia" class="w-4 h-4 text-sinal"></span> <span id="texto-auto">Ajuste automático</span>
        </button>
        <div id="filtros" class="flex gap-3 overflow-x-auto sem-barra pb-2 mb-2" role="radiogroup" aria-label="Filtros"></div>
        <label class="flex items-center gap-3 text-sm mb-2">
          <span data-icon="sol" class="w-5 h-5 text-white/70"></span>
          <span class="w-20">Brilho</span>
          <input id="ajuste-brilho" type="range" min="50" max="150" value="100" class="deslizante flex-1" />
          <output id="valor-brilho" class="w-10 text-right tabular-nums text-white/70">0</output>
        </label>
        <label class="flex items-center gap-3 text-sm mb-4">
          <span data-icon="camadas" class="w-5 h-5 text-white/70"></span>
          <span class="w-20">Contraste</span>
          <input id="ajuste-contraste" type="range" min="50" max="150" value="100" class="deslizante flex-1" />
          <output id="valor-contraste" class="w-10 text-right tabular-nums text-white/70">0</output>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <button id="editor-cancelar" class="botao bg-white/10 text-white">Cancelar</button>
          <button id="editor-salvar" class="botao bg-sinal text-jovi-900">Salvar</button>
        </div>
      </section>
    </div>
    <!-- Scripts (a ordem importa: lucide → ícones → dados → componentes → página) -->
    <script src="https://unpkg.com/lucide@1.46.0/dist/umd/lucide.min.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
    <script src="js/foto.js"></script>
  </body>
</html>
